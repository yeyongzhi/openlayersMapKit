<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMap测试</title>
    <script src="./ol_10.6.0.js"></script>
    <link rel="stylesheet" href="./ol_10.6.0.css">
    <link rel="stylesheet" href="./index.css">
    <script src="../../dist/omap.umd.js"></script>
</head>

<body>
    <div class="handle_container">
        <h3>地图信息</h3>
        <h5>
            地图中心点：
            <span class="border_text" id="map_center">-</span>
        </h5>
        <h5>
            地图分辨率：
            <span class="border_text" id="map_resolution">-</span>
        </h5>
        <h5>
            地图边界范围：
            <span class="border_text" id="map_extent">-</span>
        </h5>
        <h5>
            地图层级：
            <span class="border_text" id="map_zoom">-</span>
        </h5>
        <h5>
            点击位置：
            <span class="border_text" id="click_lnglat">-</span>
        </h5>
        <div class="border"></div>
        <h3>交互</h3>
        <h5>
            abortDrawing：
            <button id="abortDrawing">cancel</button>
            <button id="removeLastPoint">revoke</button>
            <button id="finishDrawing">finish</button>
        </h5>
        <div class="border"></div>
        <h5>
            extent：
            <button id="getExtent">getExtent</button>
        </h5>
    </div>
    <div class="map_container" id="map_container"></div>
    <script src="./index.js"></script>
</body>

</html>
