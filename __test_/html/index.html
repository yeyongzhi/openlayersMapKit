<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMap测试</title>
    <script src="./ol_10.6.0.js"></script>
    <link rel="stylesheet" href="./ol_10.6.0.css">
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="../omap.css">
    <script src="../../dist/omap.umd.js"></script>
</head>

<body>
    <div class="handle_container">
        <h3>地图信息</h3>
        <h5>
            地图中心点：
            <span class="border_text" id="map_center">-</span>
        </h5>
        <h5>
            地图分辨率：
            <span class="border_text" id="map_resolution">-</span>
        </h5>
        <h5>
            地图边界范围：
            <span class="border_text" id="map_extent">-</span>
        </h5>
        <h5>
            地图层级：
            <span class="border_text" id="map_zoom">-</span>
        </h5>
        <h5>
            点击位置：
            <span class="border_text" id="click_lnglat">-</span>
        </h5>
        <div class="border"></div>
        <!-- 交互 -->
        <h3>交互</h3>
        <p>以下三个交互默认自动开启</h5>
        <h5>
            DoubleClickZoom:
            <input type="checkbox" id="DoubleClickZoom">
        </h5>
        <h5>
            MouseWheelZoom:
            <input type="checkbox" id="MouseWheelZoom">
        </h5>
        <h5>
            DragPan:
            <input type="checkbox" id="DragPan">
        </h5>
        <div class="border"></div>
        <h5>
            Draw绘制功能
            <select id="drawType">
                <option value="Point">点</option>
                <option value="LineString">线</option>
                <option value="Polygon">面</option>
                <option value="Rectangle">矩形</option>
                <option value="Circle">圆</option>
            </select>
            <input type="checkbox" id="Draw">
            <div style="margin-top: 10px;">
                <button id="abortDrawing">取消绘制</button>
                <button id="removeLastPoint">撤销</button>
                <button id="finishDrawing">完成绘制</button>
                <button id="destroyDraw">销毁</button>
                <button id="clearDraw">清空</button>
            </div>
        </h5>
        <div class="border"></div>
        <h5>
            Select选择功能
            <input type="checkbox" id="Select">交互开启
            <input type="checkbox" id="SelectLayer">图层
            <div style="margin-top: 10px;">
                <button id="abortDrawing">取消绘制</button>
                <button id="removeLastPoint">撤销</button>
                <button id="finishDrawing">完成绘制</button>
                <button id="destroyDraw">销毁</button>
                <button id="clearDraw">清空</button>
            </div>
        </h5>
        <h5>
            extent：
            <button id="getExtent">getExtent</button>
        </h5>
        <h5>
            modify
            <button id="Modifyrevoke">撤销</button>
        </h5>
        <h5>
            Measure 测量：
            <button id="MeasureDistance">测距</button>
            <button id="MeasureArea">测面</button>
            <button id="endMeasure">结束</button>
        </h5>
        <!-- <div class="border"></div> -->
        <h3>图层</h3>
        <div class="border"></div>
        <h5>
            切换底图
            <button id="switchBaseLayer">切换</button>
        </h5>
    </div>
    <div id="message-container"></div>
    <div class="map_container" id="map_container"></div>
    <script src="./index.js"></script>
</body>

</html>
