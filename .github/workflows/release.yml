name: Package rehearsal

# No automatic release trigger. Default dispatch validates and packs only.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated tag (requires NPM_PUBLISH_ENABLED=true)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release
        run: pnpm release:check --check-registry
        env:
          RELEASE_REQUIRE_TAG: ${{ inputs.publish }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:all
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  publish:
    if: inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Publish the exact validated tarball
        env:
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: npm publish "artifacts/openlayers-map-kit-${PACKAGE_VERSION}.tgz" --ignore-scripts --access public --tag "$DIST_TAG"
